      - { label: "Penulis", name: "penulis", widget: "relation", collection: "penulis", file: "penulis", value_field: "items.*.slug", search_fields: ["items.*.nama"], display_fields: ["items.*.nama"], required: false }
      - { label: "Artikel Unggulan", name: "featured", widget: "boolean", default: false }
