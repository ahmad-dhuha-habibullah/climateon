backend:
  name: github
  repo: ahmad-dhuha-habibullah/climateon
  branch: 11ty-sveltia

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "id"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "iklim"
    label: "Iklim"
    folder: "src/content/iklim"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/artikel.njk" }
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi", name: "description", widget: "text" }
      - { label: "Kategori", name: "category", widget: "hidden", default: "iklim" }
      - { label: "Tag", name: "tags", widget: "list", allow_add: true }
      - { label: "Tanggal", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Gambar Utama", name: "image", widget: "image", required: false }
      - { label: "Video Hero (WebM/MP4)", name: "video", widget: "file", required: false }
      - { label: "Penulis", name: "penulis", widget: "relation", collection: "penulis", value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false }
      - { label: "Artikel Unggulan", name: "featured", widget: "boolean", default: false }
      - { label: "Konten", name: "body", widget: "markdown" }

  - name: "cuaca"
    label: "Cuaca"
