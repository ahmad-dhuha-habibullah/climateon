  - name: "bedah-paper"
    label: "Bedah Paper"
    folder: "src/content/bedah-paper"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/artikel.njk" }
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi", name: "description", widget: "text" }
      - { label: "Kategori", name: "category", widget: "hidden", default: "bedah-paper" }
      - { label: "Tag", name: "tags", widget: "list", allow_add: true }
      - { label: "Tanggal", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Gambar Utama", name: "image", widget: "image", required: false }
      - { label: "Video Hero (WebM/MP4)", name: "video", widget: "file", required: false }
      - { label: "Penulis CMS", name: "penulis", widget: "relation", collection: "penulis", value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false }
      - { label: "Penulis Paper", name: "penulisPaper", widget: "string", required: false }
      - { label: "Tahun Publikasi", name: "tahun", widget: "number", required: false }
      - { label: "Jurnal", name: "jurnal", widget: "string", required: false }
      - { label: "DOI", name: "doi", widget: "string", required: false }
      - { label: "Artikel Unggulan", name: "featured", widget: "boolean", default: false }
      - { label: "Konten", name: "body", widget: "markdown" }

  - name: "penulis"
    label: "Penulis"
    folder: "src/content/penulis"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nama (Gunakan nama asli bukan singkatan)", name: "title", widget: "string" }
      - { label: "Peran", name: "peran", widget: "string", default: "Kontributor" }
      - { label: "Bidang Keahlian", name: "tags", widget: "list", required: false }
      - label: "Pendidikan"
        name: "pendidikan"
        widget: "list"
        required: false
        fields:
          - { label: "Gelar/Tingkat", name: "gelar", widget: "string" }
          - { label: "Institusi", name: "institusi", widget: "string" }
          - { label: "Tahun", name: "tahun", widget: "string" }
      - { label: "Avatar", name: "avatar", widget: "image", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Google Scholar", name: "scholar", widget: "string", required: false }
      - { label: "ORCID", name: "orcid", widget: "string", required: false }
      - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "X / Twitter", name: "twitter", widget: "string", required: false }
      - { label: "Threads", name: "threads", widget: "string", required: false }
      - { label: "TikTok", name: "tiktok", widget: "string", required: false }
      - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "GitHub", name: "github", widget: "string", required: false }
      - { label: "Biografi/CV", name: "body", widget: "markdown", required: false }

  - name: "pengaturan"
    label: "Pengaturan"
    create: false
    files:
      - label: "Hero Beranda"
        name: "beranda"
        file: "src/_data/beranda.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string" }
          - { label: "Deskripsi", name: "deskripsi", widget: "text" }
          - label: "Tombol Utama"
            name: "tombolUtama"
            widget: "object"
            fields:
              - { label: "Teks", name: "teks", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Tombol Sekunder"
            name: "tombolSekunder"
            widget: "object"
            fields:
              - { label: "Teks", name: "teks", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Gambar Background", name: "image", widget: "image", required: false }
          - { label: "Video Background (WebM/MP4)", name: "video", widget: "file", required: false }

  - name: "halaman_kategori"
    label: "Halaman Kategori"
    folder: "src/content/kategori"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Kategori", name: "title", widget: "string" }
      - { label: "Deskripsi", name: "description", widget: "text" }
      - { label: "Subtopik (Tag)", name: "subtopik", widget: "list", allow_add: true }
      - { label: "Gambar Background Hero", name: "image", widget: "image", required: false }
      - { label: "Video Background Hero (WebM/MP4)", name: "video", widget: "file", required: false }
  - name: "pusat-data"
    label: "Pusat Data"
    folder: "src/content/pusat-data"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Data", name: "title", widget: "string" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }
      - { label: "Gambar Thumbnail", name: "image", widget: "image", required: false }
      - { label: "Embed URL", name: "embedUrl", widget: "string", required: false }
      - { label: "Konten Pendukung", name: "body", widget: "markdown" }

